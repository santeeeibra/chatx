<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>ChatX — En vivo</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="css/styles.css">

  <!-- SDKs via CDN -->
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.min.js"></script>
  <script src="https://openfpcdn.io/fingerprintjs/v4"></script>
  <!-- Ably Realtime SDK para signaling (transportación de offer/answer/ICE candidates) -->
  <script src="https://cdn.ably.com/lib/ably.min-2.js"></script>
</head>
<body class="app-body">

  <!-- ===== BAN OVERLAY ===== -->
  <div class="ban-overlay" id="ban-overlay">
    <div class="ban-card">
      <div class="ban-icon">🚫</div>
      <h2 class="ban-title" id="ban-title">Acceso suspendido</h2>
      <p class="ban-message" id="ban-message">Fuiste reportado por otro usuario.</p>
      <div class="ban-timer" id="ban-timer"></div>
      <p class="ban-sub">Respetá las reglas de la comunidad cuando vuelvas.</p>
      <a href="index.html" class="btn btn--ghost btn--sm" style="margin-top:1.5rem">← Volver al inicio</a>
    </div>
  </div>

  <!-- ===== APP LAYOUT ===== -->
  <div class="app-layout" id="app-layout">

    <!-- Header -->
    <header class="app-header">
      <a href="index.html" class="logo logo--sm">
        <svg width="22" height="22" viewBox="0 0 32 32" fill="none">
          <path d="M16 2L29 9.5V22.5L16 30L3 22.5V9.5L16 2Z" fill="url(#grad2)"/>
          <defs>
            <linearGradient id="grad2" x1="3" y1="2" x2="29" y2="30" gradientUnits="userSpaceOnUse">
              <stop stop-color="#7C3AED"/>
              <stop offset="1" stop-color="#EC4899"/>
            </linearGradient>
          </defs>
        </svg>
        <span class="logo__text">ChatX</span>
      </a>

      <div class="status-badge" id="status-badge">
        <span class="status-dot" id="status-dot"></span>
        <span id="status-text">Iniciando...</span>
      </div>

      <div class="header-actions">
        <button class="icon-btn" id="btn-mute" title="Silenciar micrófono">
          <svg width="18" height="18" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2">
            <path d="M12 1a3 3 0 0 0-3 3v8a3 3 0 0 0 6 0V4a3 3 0 0 0-3-3z"/>
            <path d="M19 10v2a7 7 0 0 1-14 0v-2M12 19v4M8 23h8"/>
          </svg>
        </button>
        <button class="icon-btn" id="btn-cam" title="Apagar cámara">
          <svg width="18" height="18" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2">
            <path d="M23 7l-7 5 7 5V7z"/><rect x="1" y="5" width="15" height="14" rx="2" ry="2"/>
          </svg>
        </button>
      </div>
    </header>

    <!-- Area de video -->
    <main class="video-area">
      <!-- Video remoto (fondo, fullscreen) -->
      <div class="video-box video-box--remote" id="video-remote">
        <video id="remoteVideo" autoplay playsinline style="width:100%;height:100%;object-fit:cover;display:block;"></video>
        <div class="video-placeholder" id="placeholder-remote">
          <div class="spinner"></div>
          <p id="placeholder-text">Buscando pareja...</p>
        </div>
        <!-- Overlay de desconexión del remoto -->
        <div class="disconnect-overlay hidden" id="disconnect-overlay">
          <p class="disconnect-msg">Tu pareja se desconectó</p>
          <p class="disconnect-countdown" id="disconnect-countdown">Buscando nueva pareja en 5...</p>
        </div>
      </div>

      <!-- Video local (PiP, esquina) -->
      <div class="video-box video-box--local" id="video-local-wrapper">
        <video id="localVideo" autoplay muted playsinline></video>
        <div class="video-placeholder video-placeholder--sm" id="placeholder-local">
          <p>Iniciando cámara...</p>
        </div>
      </div>
    </main>

    <!-- Controles inferiores -->
    <footer class="app-controls">
      <button class="btn btn--danger" id="btn-reportar" disabled>
        <svg width="16" height="16" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2">
          <path d="M4 15s1-1 4-1 5 2 8 2 4-1 4-1V3s-1 1-4 1-5-2-8-2-4 1-4 1z"/><line x1="4" y1="22" x2="4" y2="15"/>
        </svg>
        Reportar
      </button>

      <button class="btn btn--primary btn--lg" id="btn-siguiente">
        Siguiente
        <svg width="18" height="18" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2.5">
          <path d="M5 12h14M12 5l7 7-7 7"/>
        </svg>
      </button>
    </footer>

  </div>

  <!-- ===== REPORT MODAL ===== -->
  <div class="modal-backdrop hidden" id="report-modal">
    <div class="modal-card" role="dialog" aria-modal="true" aria-labelledby="modal-title">
      <h2 class="modal-title" id="modal-title">Reportar usuario</h2>

      <div class="modal-reasons" id="modal-reasons">
        <label class="modal-radio">
          <input type="radio" name="report-reason" value="Contenido inapropiado">
          <span>Contenido inapropiado</span>
        </label>
        <label class="modal-radio">
          <input type="radio" name="report-reason" value="Comportamiento ofensivo">
          <span>Comportamiento ofensivo</span>
        </label>
        <label class="modal-radio">
          <input type="radio" name="report-reason" value="Menor de edad">
          <span>Menor de edad</span>
        </label>
        <label class="modal-radio">
          <input type="radio" name="report-reason" value="Spam">
          <span>Spam</span>
        </label>
        <label class="modal-radio">
          <input type="radio" name="report-reason" value="Otro">
          <span>Otro</span>
        </label>
      </div>

      <textarea class="modal-textarea" id="report-comment" placeholder="Comentario adicional (opcional)" rows="3"></textarea>

      <div class="modal-actions">
        <button class="btn btn--ghost" id="btn-modal-cancel">Cancelar</button>
        <button class="btn btn--primary" id="btn-modal-submit">Enviar reporte</button>
      </div>
    </div>
  </div>

  <!-- ===== TOAST ===== -->
  <div class="toast hidden" id="toast"></div>

  <!-- Scripts (ES modules) -->
  <script type="module" src="js/app.js"></script>

</body>
</html>
