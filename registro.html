<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="robots" content="noindex">
  <title>CamReal — Registro / Iniciar sesión</title>
  <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>🎥</text></svg>">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="css/styles.css">
  <style>
    .auth-page {
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      padding: 2rem 1rem;
    }
    .auth-back {
      display: inline-flex;
      align-items: center;
      gap: .4rem;
      color: var(--text-muted);
      font-size: .85rem;
      margin-bottom: 1.5rem;
      transition: color .15s;
    }
    .auth-back:hover { color: var(--text); }
    .auth-card {
      background: var(--card);
      border: 1px solid var(--border);
      border-radius: var(--radius);
      padding: 2.5rem 2rem;
      max-width: 420px;
      width: 100%;
      box-shadow: var(--shadow);
    }
    .auth-card .logo {
      justify-content: center;
      margin-bottom: .25rem;
    }
    .auth-sub {
      text-align: center;
      color: var(--text-muted);
      font-size: .875rem;
      margin-bottom: 1.5rem;
    }
    .auth-form { display: none; }
    .auth-form.active { display: block; }
    .auth-error-box {
      background: rgba(239,68,68,.08);
      border: 1px solid rgba(239,68,68,.35);
      border-radius: var(--radius-sm);
      color: var(--danger);
      font-size: .825rem;
      line-height: 1.4;
      padding: .65rem .9rem;
      margin-bottom: 1rem;
    }
    .auth-error-box.hidden { display: none; }
    .auth-logged {
      display: none;
      text-align: center;
      gap: .75rem;
      flex-direction: column;
      color: var(--text-muted);
      font-size: .875rem;
    }
    .auth-logged.active { display: flex; }
    .auth-logged p { margin: 0; }
    .auth-footer {
      margin-top: 1.5rem;
      text-align: center;
      font-size: .8rem;
      color: var(--text-faint);
    }
    .auth-footer a { color: var(--text-muted); transition: color .15s; }
    .auth-footer a:hover { color: var(--text); }
    .spinner-btn {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: .5rem;
    }
    .spinner-btn::after {
      content: '';
      width: 14px;
      height: 14px;
      border: 2px solid rgba(255,255,255,.35);
      border-top-color: #fff;
      border-radius: 50%;
      display: none;
      animation: auth-spin .7s linear infinite;
    }
    .spinner-btn.loading::after { display: inline-block; }
    @keyframes auth-spin { to { transform: rotate(360deg); } }
  </style>
</head>
<body class="landing-body">

  <div class="landing-bg">
    <div class="landing-glow"></div>
  </div>

  <main class="auth-page">
    <a href="index.html" class="auth-back">← Volver al inicio</a>

    <div class="auth-card">

      <div class="logo">
        <svg width="28" height="28" viewBox="0 0 32 32" fill="none">
          <path d="M16 2L29 9.5V22.5L16 30L3 22.5V9.5L16 2Z" fill="url(#grad)" stroke="none"/>
          <defs>
            <linearGradient id="grad" x1="3" y1="2" x2="29" y2="30" gradientUnits="userSpaceOnUse">
              <stop stop-color="#6D28D9"/>
              <stop offset="1" stop-color="#EC4899"/>
            </linearGradient>
          </defs>
        </svg>
        <span class="logo__text">CamReal</span>
      </div>
      <p class="auth-sub">Creá tu cuenta o iniciá sesión para desbloquear menos restricciones.</p>

      <!-- Toggle Registro / Login -->
      <div class="auth-tabs" role="tablist">
        <button type="button" class="auth-tab active" data-tab="register" role="tab">Registrarse</button>
        <button type="button" class="auth-tab" data-tab="login" role="tab">Iniciar sesión</button>
      </div>
<!-- Mensaje de error inline -->
      <div id="auth-error" class="auth-error-box hidden" role="alert"></div>

      <!-- Formulario de REGISTRO -->
      <form class="auth-form active" data-form="register" novalidate>
        <div class="auth-fields">
          <input type="email" id="reg-email" class="modal-input" placeholder="Email" autocomplete="email" required>
          <input type="password" id="reg-password" class="modal-input" placeholder="Contraseña (mín. 6 caracteres)" autocomplete="new-password" minlength="6" required>
          <input type="password" id="reg-confirm" class="modal-input" placeholder="Confirmar contraseña" autocomplete="new-password" required>
        </div>
        <button type="submit" id="btn-register" class="btn btn--primary btn--lg spinner-btn" style="width:100%;margin-top:1rem;">
          <span class="btn-label">Registrarse</span>
        </button>
      </form>

      <!-- Formulario de LOGIN -->
      <form class="auth-form" data-form="login" novalidate>
        <div class="auth-fields">
          <input type="email" id="login-email" class="modal-input" placeholder="Email" autocomplete="email" required>
          <input type="password" id="login-password" class="modal-input" placeholder="Contraseña" autocomplete="current-password" required>
        </div>
        <button type="submit" id="btn-login" class="btn btn--primary btn--lg spinner-btn" style="width:100%;margin-top:1rem;">
          <span class="btn-label">Iniciar sesión</span>
        </button>
      </form>

      <!-- Estado logueado + logout -->
      <div id="logged-in" class="auth-logged">
        <p>Ya tenés una sesión activa: <strong id="logged-email"></strong></p>
        <button id="btn-logout" class="btn btn--danger">Cerrar sesión</button>
      </div>

      <p class="auth-footer">¿No tenés cuenta todavía? <a href="#" id="link-switch-to-register">Registrate gratis</a></p>

    </div>
  </main>

  <!-- SDKs via CDN -->
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.min.js"></script>
<script type="module">
    import { supabase } from './js/supabase-client.js';

    // ── DOM refs ──────────────────────────────────────────────
    const tabs          = document.querySelectorAll('.auth-tab');
    const forms         = document.querySelectorAll('.auth-form');
    const errorBox      = document.getElementById('auth-error');
    const regForm       = document.querySelector('[data-form="register"]');
    const loginForm     = document.querySelector('[data-form="login"]');
    const regEmail      = document.getElementById('reg-email');
    const regPassword   = document.getElementById('reg-password');
    const regConfirm    = document.getElementById('reg-confirm');
    const loginEmail    = document.getElementById('login-email');
    const loginPassword = document.getElementById('login-password');
    const btnRegister   = document.getElementById('btn-register');
    const btnLogin      = document.getElementById('btn-login');
    const loggedInBox   = document.getElementById('logged-in');
    const loggedEmail   = document.getElementById('logged-email');
    const btnLogout     = document.getElementById('btn-logout');
    const switchToReg   = document.getElementById('link-switch-to-register');

    let currentTab = 'register'; // 'register' | 'login'

    // ── Helpers ───────────────────────────────────────────────
    function showError(msg) {
      errorBox.textContent = msg;
      errorBox.classList.remove('hidden');
    }
    function clearError() {
      errorBox.classList.add('hidden');
      errorBox.textContent = '';
    }

    function setLoading(btn, loading, label) {
      btn.classList.toggle('loading', loading);
      btn.disabled = loading;
      if (label) btn.querySelector('.btn-label').textContent = label;
    }

    function greetFriendly(message) {
      if (!message) return 'Ocurrió un error. Intentá de nuevo.';
      const es = {
        'user already registered': 'Ese email ya está registrado.',
        'invalid login credentials': 'Email o contraseña incorrectos.',
        'unable to validate email': 'No pudimos validar tu email.',
        'password should be at least 6 characters': 'La contraseña debe tener al menos 6 caracteres.',
        'network error': 'Problema de conexión. Intentá de nuevo.',
      };
      const lower = message.toLowerCase();
      for (const [key, val] of Object.entries(es)) {
        if (lower.includes(key)) return val;
      }
      return message;
    }

    // ── Guard de sesión activa → redirigir a index.html ──────
    const { data: sessionData } = await supabase.auth.getSession();
    if (sessionData.session?.user) {
      window.location.href = 'index.html';
    }

    // ── Toggle tabs ───────────────────────────────────────────
    function switchTab(tabName) {
      currentTab = tabName;
      tabs.forEach(t => t.classList.toggle('active', t.dataset.tab === currentTab));
      forms.forEach(f => f.classList.toggle('active', f.dataset.form === currentTab));
      switchToReg.style.display = currentTab === 'login' ? 'inline' : 'none';
      clearError();
    }

    tabs.forEach(tab => {
      tab.addEventListener('click', () => switchTab(tab.dataset.tab));
    });

    switchToReg.addEventListener('click', (e) => {
      e.preventDefault();
      switchTab('register');
    });
// ── Registro ──────────────────────────────────────────────
    regForm.addEventListener('submit', async (e) => {
      e.preventDefault();
      clearError();

      const email    = regEmail.value.trim();
      const password = regPassword.value;
      const confirm  = regConfirm.value;

      if (!email || !password || !confirm) { showError('Completá todos los campos.'); return; }
      if (!/^[^\s@]+@[^\s@]+\.[^\s@]+$/.test(email)) { showError('Ingresá un email válido.'); return; }
      if (password.length < 6) { showError('La contraseña debe tener al menos 6 caracteres.'); return; }
      if (password !== confirm) { showError('Las contraseñas no coinciden.'); return; }

      setLoading(btnRegister, true, 'Creando cuenta…');

      const { data, error } = await supabase.auth.signUp({ email, password });

      setLoading(btnRegister, false, 'Registrarse');

      if (error) { showError(greetFriendly(error.message)); return; }

      // Confirmación por email configurada → user viene null hasta confirmar
      if (!data.user) {
        showError('Revisá tu email para confirmar el registro. Después podés iniciar sesión.');
        return;
      }

      window.location.href = 'index.html';
    });

    // ── Login ─────────────────────────────────────────────────
    loginForm.addEventListener('submit', async (e) => {
      e.preventDefault();
      clearError();

      const email    = loginEmail.value.trim();
      const password = loginPassword.value;

      if (!email || !password) { showError('Completá email y contraseña.'); return; }

      setLoading(btnLogin, true, 'Ingresando…');

      const { data, error } = await supabase.auth.signInWithPassword({ email, password });

      setLoading(btnLogin, false, 'Iniciar sesión');

      if (error) { showError(greetFriendly(error.message)); return; }
      if (!data.user) { showError('No pudimos iniciar sesión. Intentá de nuevo.'); return; }

      window.location.href = 'index.html';
    });

    // ── Logout ────────────────────────────────────────────────
    btnLogout.addEventListener('click', async () => {
      btnLogout.disabled = true;
      btnLogout.textContent = 'Cerrando…';
      await supabase.auth.signOut();
      btnLogout.disabled = false;
      btnLogout.textContent = 'Cerrar sesión';
      loggedInBox.classList.remove('active');
      switchTab(currentTab);
    });
  </script>

</body>
</html>
